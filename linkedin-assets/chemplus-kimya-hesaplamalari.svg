<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8FAFF"/><stop offset="1" stop-color="#EEF2FF"/></linearGradient><linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#4F46E5"/></linearGradient></defs>
<rect width="1200" height="627" rx="28" fill="url(#bg)"/>
<circle cx="1010" cy="120" r="190" fill="#DBEAFE" opacity=".6"/><circle cx="1100" cy="520" r="160" fill="#E9D5FF" opacity=".55"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="70" y="82" font-size="34" font-weight="700" fill="#111827">Chem<tspan fill="#7C3AED">Plus</tspan><tspan fill="#7C3AED" font-size="22" baseline-shift="super">+</tspan></text>
<text x="70" y="170" font-size="48" font-weight="700" fill="#0F172A">Kimya hesaplarında</text>
<text x="70" y="228" font-size="48" font-weight="700" fill="#2563EB">daha düzenli bir akış.</text>
<text x="72" y="274" font-size="23" fill="#334155">Hesapla. Kontrol et. Sonucu anlamlandır.</text>
<rect x="70" y="326" width="495" height="108" rx="20" fill="#FFFFFF" stroke="#D8E2F2" stroke-width="2"/>
<circle cx="120" cy="380" r="27" fill="#DBEAFE"/><text x="120" y="390" font-size="31" text-anchor="middle" font-weight="700" fill="#2563EB">∑</text>
<text x="165" y="372" font-size="24" font-weight="700" fill="#0F172A">Kimyasal hesaplamalar</text><text x="165" y="404" font-size="18" fill="#475569">Mol · Molarite · Çözelti hesabı</text>
<rect x="70" y="452" width="495" height="108" rx="20" fill="#FFFFFF" stroke="#D8E2F2" stroke-width="2"/>
<circle cx="120" cy="506" r="27" fill="#EDE9FE"/><text x="120" y="516" font-size="29" text-anchor="middle" font-weight="700" fill="#7C3AED">✓</text>
<text x="165" y="498" font-size="24" font-weight="700" fill="#0F172A">Birimleri ve varsayımları kontrol et</text><text x="165" y="530" font-size="18" fill="#475569">Dijital araçlar bilimsel muhakemenin yerine geçmez.</text>
<rect x="690" y="160" width="430" height="300" rx="28" fill="#0F1B3D"/>
<rect x="720" y="190" width="370" height="52" rx="12" fill="#1D2D5B"/><text x="744" y="224" font-size="19" fill="#DDE8FF">ChemPlus · Hesaplama alanı</text>
<text x="730" y="287" font-size="17" fill="#BFD0F8">Madde miktarı (n)</text><rect x="730" y="300" width="155" height="42" rx="9" fill="#FFFFFF"/><text x="748" y="327" font-size="18" fill="#172554">0.50 mol</text>
<text x="910" y="287" font-size="17" fill="#BFD0F8">Hacim (V)</text><rect x="910" y="300" width="155" height="42" rx="9" fill="#FFFFFF"/><text x="928" y="327" font-size="18" fill="#172554">1.00 L</text>
<rect x="730" y="365" width="335" height="61" rx="12" fill="url(#purple)"/><text x="897" y="403" font-size="23" font-weight="700" text-anchor="middle" fill="#FFFFFF">M = n / V</text>
<text x="690" y="500" font-size="20" font-weight="700" fill="#1E293B">Dijital destek, kontrollü hesaplama.</text>
